name: Refresh and publish own-shop catalog
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: catalog-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p test_build.py
      - run: python scripts/build.py
      - name: Preserve stable feed identifiers
        run: |
          git config user.name 'Cowling catalog updater'
          git config user.email 'catalog-updater@users.noreply.github.com'
          git add index.html products feed.xml state.json .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh own-shop catalog and native Pinterest feed'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publish website
        uses: actions/deploy-pages@v4
